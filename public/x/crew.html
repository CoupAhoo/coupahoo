<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Coup Ahoo crew at sea</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap" rel="stylesheet" />
    <style>
      html, body { margin: 0; background: #111; }
      * { box-sizing: border-box; }
      .board {
        position: relative; width: 1500px; height: 1000px; overflow: hidden;
        background: #5d9acf;
        font-family: "Luckiest Guy", "Arial Black", sans-serif;
      }
      .bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      .fg { position: absolute; object-fit: contain; pointer-events: none; }
      .sea {
        position: absolute; left: 0; right: 0; bottom: 0; height: 38%;
        background: linear-gradient(#03fcf4 0%, #2aa9bd 70%);
      }
      .t {
        margin: 0; color: #ff3; text-align: center; line-height: 0.9;
        -webkit-text-stroke: 0.07em #000; paint-order: stroke fill; letter-spacing: 0.03em;
      }
      .s {
        margin: 0; color: #fff8e7; text-align: center;
        -webkit-text-stroke: 0.07em #000; paint-order: stroke fill;
      }
      .bubble {
        position: absolute;
        background: #fff8e7;
        border: 5px solid #000;
        border-radius: 22px;
        padding: 10px 14px 8px;
        color: #000;
        font-size: 20px;
        line-height: 1.12;
        text-align: center;
        box-shadow: 5px 5px 0 #000;
        z-index: 8;
      }
      .bubble:after {
        content: "";
        position: absolute;
        left: 50%;
        margin-left: -12px;
        bottom: -22px;
        width: 0; height: 0;
        border: 12px solid transparent;
        border-top-color: #000;
      }
      .who { display: block; font-size: 13px; color: #633f15; margin-bottom: 3px; letter-spacing: 0.04em; }
    </style>
  </head>
  <body>
    <div class="board" id="crew">
      <img class="bg" src="/ahoo/sky-texture.svg" alt="" />
      <img class="fg" src="/ahoo/clouds.svg" alt="" style="top:-10px;left:-40px;width:1600px;height:240px" />
      <div class="sea"></div>
      <svg class="fg" viewBox="0 0 1500 80" style="left:0;bottom:35%;width:1500px;height:70px;z-index:2">
        <path d="M0,40 Q50,12 100,40 T200,40 T300,40 T400,40 T500,40 T600,40 T700,40 T800,40 T900,40 T1000,40 T1100,40 T1200,40 T1300,40 T1400,40 T1500,40 L1500,80 L0,80 Z" fill="#03fcf4" stroke="#fff" stroke-width="6"/>
      </svg>

      <p class="t" style="position:absolute;left:0;right:0;top:10px;font-size:56px;z-index:9">THE CREW TALKS</p>
      <p class="s" style="position:absolute;left:0;right:0;top:74px;font-size:22px;z-index:9">COUP AHOO · coupahoo.lol</p>

      <img class="fg" src="/ahoo/ship-player.svg" alt="" style="left:140px;bottom:10px;width:1220px;height:780px;z-index:3" />

      <div class="bubble" style="left:40px;top:118px;width:240px">
        <span class="who">LOOKOUT</span>
        Their first ball hits water.
      </div>
      <img class="fg" src="/ahoo/crew-navigator.svg" alt="" style="left:210px;bottom:305px;width:200px;height:270px;z-index:5" />

      <div class="bubble" style="left:340px;top:108px;width:300px">
        <span class="who">CAPTAIN</span>
        Dice are your hull. Don't roll thirteen.
      </div>
      <img class="fg" src="/ahoo/captain-posing.svg" alt="" style="left:430px;bottom:285px;width:250px;height:340px;z-index:6" />

      <div class="bubble" style="left:740px;top:118px;width:260px">
        <span class="who">GUNNER</span>
        First shot bites +1. Keep the twos.
      </div>
      <img class="fg" src="/ahoo/crew-cannoneer.svg" alt="" style="left:760px;bottom:300px;width:200px;height:270px;z-index:5" />

      <div class="bubble" style="left:1080px;top:118px;width:360px">
        <span class="who">CARPENTER</span>
        I plate a crate. The Chest pays the wake.
      </div>
      <img class="fg" src="/ahoo/crew-quartermaster.svg" alt="" style="left:1120px;bottom:300px;width:200px;height:270px;z-index:5" />
    </div>
  </body>
</html>
