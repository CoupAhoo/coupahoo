<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Coup Ahoo crew at sea</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap" rel="stylesheet" />
    <style>
      html, body { margin: 0; background: #111; }
      * { box-sizing: border-box; }
      .board {
        position: relative; width: 1500px; height: 1000px; overflow: hidden;
        background: #5d9acf;
        font-family: "Luckiest Guy", "Arial Black", sans-serif;
      }
      .bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      .fg { position: absolute; object-fit: contain; pointer-events: none; }
      .sea {
        position: absolute; left: 0; right: 0; bottom: 0; height: 42%;
        background: linear-gradient(#03fcf4 0%, #2aa9bd 78%);
      }
      .t {
        margin: 0; color: #ff3; text-align: center; line-height: 0.9;
        -webkit-text-stroke: 0.07em #000; paint-order: stroke fill; letter-spacing: 0.03em;
      }
      .s {
        margin: 0; color: #fff8e7; text-align: center;
        -webkit-text-stroke: 0.07em #000; paint-order: stroke fill;
      }
      .bubble {
        position: absolute;
        background: #fff8e7;
        border: 5px solid #000;
        border-radius: 20px;
        padding: 8px 12px 6px;
        color: #000;
        font-size: 18px;
        line-height: 1.1;
        text-align: center;
        box-shadow: 4px 4px 0 #000;
        z-index: 8;
      }
      .bubble:after {
        content: "";
        position: absolute;
        left: 50%;
        margin-left: -11px;
        bottom: -20px;
        width: 0; height: 0;
        border: 11px solid transparent;
        border-top-color: #000;
      }
      .who { display: block; font-size: 12px; color: #633f15; margin-bottom: 2px; letter-spacing: 0.04em; }
    </style>
  </head>
  <body>
    <div class="board" id="crew">
      <img class="bg" src="/ahoo/sky-texture.svg" alt="" />
      <img class="fg" src="/ahoo/clouds.svg" alt="" style="top:0;left:-40px;width:1600px;height:200px" />
      <div class="sea"></div>
      <svg class="fg" viewBox="0 0 1500 80" style="left:0;bottom:39%;width:1500px;height:64px;z-index:2">
        <path d="M0,40 Q50,14 100,40 T200,40 T300,40 T400,40 T500,40 T600,40 T700,40 T800,40 T900,40 T1000,40 T1100,40 T1200,40 T1300,40 T1400,40 T1500,40 L1500,80 L0,80 Z" fill="#03fcf4" stroke="#fff" stroke-width="6"/>
      </svg>

      <p class="t" style="position:absolute;left:0;right:0;top:8px;font-size:52px;z-index:9">THE CREW TALKS</p>
      <p class="s" style="position:absolute;left:0;right:0;top:68px;font-size:20px;z-index:9">COUP AHOO · coupahoo.lol</p>

      <img class="fg" src="/ahoo/ship-player.svg" alt=""
           style="left:250px;bottom:20px;width:1000px;height:700px;z-index:3" />

      <div class="bubble" style="left:280px;top:430px;width:250px">
        <span class="who">CAPTAIN</span>
        Dice are your hull. Don't roll thirteen.
      </div>

      <div class="bubble" style="left:640px;top:380px;width:230px">
        <span class="who">GUNNER</span>
        Hire me. First shot bites +1.
      </div>
      <img class="fg" src="/ahoo/crew-cannoneer.svg" alt=""
           style="left:640px;bottom:290px;width:160px;height:220px;z-index:5" />

      <div class="bubble" style="left:820px;top:380px;width:240px">
        <span class="who">SHIPWRIGHT</span>
        I plate a crate. It shrugs a pip.
      </div>
      <img class="fg" src="/ahoo/crew-quartermaster.svg" alt=""
           style="left:820px;bottom:290px;width:160px;height:220px;z-index:5" />
    </div>
  </body>
</html>
