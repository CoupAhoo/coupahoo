<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Coup Ahoo X kit</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap" rel="stylesheet" />
    <style>
      html, body { margin: 0; background: #111; }
      .board { position: relative; overflow: hidden; background: #5d9acf; }
      .board img.bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
      .board img.fg { position: absolute; object-fit: contain; display: block; pointer-events: none; }
      .title {
        position: absolute; left: 0; right: 0; top: 18px; margin: 0;
        font-family: "Luckiest Guy", "Arial Black", sans-serif;
        color: #ff3; text-align: center; line-height: 0.9; letter-spacing: 0.03em;
        -webkit-text-stroke: 0.08em #000; paint-order: stroke fill;
        pointer-events: none;
      }
      .sub {
        position: absolute; left: 0; right: 0; margin: 0;
        font-family: "Luckiest Guy", "Arial Black", sans-serif;
        color: #fff8e7; text-align: center;
        -webkit-text-stroke: 0.07em #000; paint-order: stroke fill;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <!-- PFP 800x800: sky + captain -->
    <div id="logo" class="board" style="width:800px;height:800px">
      <img class="bg" src="/ahoo/sky-texture.svg" alt="" />
      <img class="fg" src="/ahoo/clouds.svg" alt="" style="top:8px;left:-40px;width:900px;height:240px" />
      <img class="fg" src="/ahoo/captain.svg" alt="" style="left:70px;top:40px;width:660px;height:780px" />
    </div>

    <!-- Banner 5:2: hero ship scene -->
    <div id="banner" class="board" style="width:1500px;height:600px">
      <img class="bg" src="/ahoo/scene-hero.svg" alt="" />
      <p class="title" style="font-size:92px;top:16px">~ COUP AHOO ~</p>
    </div>

    <!-- Cover 5:2: battle scene -->
    <div id="cover" class="board" style="width:1500px;height:600px">
      <img class="bg" src="/ahoo/scene-battle.svg" alt="" />
      <p class="title" style="font-size:84px;top:14px">~ COUP AHOO ~</p>
      <p class="sub" style="top:108px;font-size:34px">DON'T ROLL THIRTEEN</p>
    </div>

    <!-- Square cover / article -->
    <div id="square" class="board" style="width:1000px;height:1000px">
      <img class="bg" src="/ahoo/cover-1000.svg" alt="" style="object-fit:contain" />
    </div>

    <!-- OG 1200x630 -->
    <div id="og" class="board" style="width:1200px;height:630px">
      <img class="bg" src="/ahoo/scene-hero.svg" alt="" />
      <p class="title" style="font-size:78px;top:20px">~ COUP AHOO ~</p>
      <p class="sub" style="top:112px;font-size:30px">DICE ARE YOUR HULL</p>
    </div>
  </body>
</html>
