<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Play Coup Ahoo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap" rel="stylesheet" />
    <style>
      html, body { margin: 0; background: #111; }
      * { box-sizing: border-box; }
      .board {
        position: relative; width: 1500px; height: 1000px; overflow: hidden;
        background: #5d9acf;
        font-family: "Luckiest Guy", "Arial Black", sans-serif;
      }
      .bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      .t {
        margin: 0; color: #ff3; text-align: center; line-height: 0.9;
        -webkit-text-stroke: 0.07em #000; paint-order: stroke fill; letter-spacing: 0.03em;
      }
      .s {
        margin: 0; color: #fff8e7; text-align: center;
        -webkit-text-stroke: 0.07em #000; paint-order: stroke fill;
      }
      .grid {
        position: absolute; left: 32px; right: 32px; top: 150px; bottom: 28px;
        display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 16px;
      }
      .card {
        position: relative; overflow: hidden;
        border: 6px solid #000; border-radius: 16px; background: #5d9acf;
        box-shadow: 6px 6px 0 #000;
      }
      .card img.scene {
        position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
        object-position: center 40%;
      }
      .cap {
        position: absolute; left: 10px; right: 10px; bottom: 10px;
        margin: 0; padding: 8px 10px;
        background: #fff8e7; border: 4px solid #000; border-radius: 12px;
        color: #000; font-size: 22px; text-align: center; line-height: 1.05;
        z-index: 2;
      }
    </style>
  </head>
  <body>
    <div class="board" id="howto">
      <img class="bg" src="/ahoo/sky-texture.svg" alt="" />
      <p class="t" style="position:absolute;left:0;right:0;top:16px;font-size:64px">PLAY THE GAME</p>
      <p class="s" style="position:absolute;left:0;right:0;top:90px;font-size:26px">COUP AHOO · coupahoo.lol</p>
      <div class="grid">
        <article class="card">
          <img class="scene" src="/ahoo/scene-hero.svg" alt="" />
          <p class="cap">1. ROLL YOUR CARGO</p>
        </article>
        <article class="card">
          <img class="scene" src="/ahoo/scene-battle.svg" alt="" style="object-position: center 55%" />
          <p class="cap">2. DON'T ROLL THIRTEEN</p>
        </article>
        <article class="card">
          <img class="scene" src="/ahoo/ship-player.svg" alt="" style="object-fit: contain; object-position: center 70%; background: #5d9acf" />
          <img src="/ahoo/sky-texture.svg" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0" />
          <img src="/ahoo/ship-player.svg" alt="" style="position:absolute;left:8%;right:8%;bottom:-8%;height:95%;object-fit:contain;z-index:1" />
          <p class="cap">3. TAKE THE FLEET</p>
        </article>
        <article class="card">
          <img src="/ahoo/sky-texture.svg" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover" />
          <img src="/ahoo/captain-posing.svg" alt="" style="position:absolute;left:18%;bottom:-6%;height:92%;object-fit:contain;z-index:1" />
          <p class="cap">4. LOG TO THE CHEST</p>
        </article>
      </div>
    </div>
  </body>
</html>
